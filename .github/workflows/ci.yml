name: .NET CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned localization dependency
        shell: pwsh
        run: ./eng/Prepare-LazyTranslate.ps1
      - name: Restore
        run: dotnet restore CompactGUI.slnx
      - name: Build without warnings
        run: dotnet build CompactGUI.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test CompactGUI.slnx --configuration Release --no-build --no-restore
