name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: csharp
      - run: ./eng/Prepare-LazyTranslate.ps1
        shell: pwsh
      - run: dotnet restore CompactGUI.slnx
      - run: dotnet build CompactGUI.slnx --configuration Release --no-restore
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
